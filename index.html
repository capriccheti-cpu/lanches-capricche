<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Capricche — Estação de Lanches</title>
  
<style>
:root{
  --bg:#F4EEE6;
  --card:#F8F4EE;
  --primary:#C65B36;
  --primary-dark:#A84826;
  --text:#3D2A20;
  --text-light:#7A6A5A;
  --border:#E2D8CC;
}

*{
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  margin:0;
  background:var(--bg);
  color:var(--text);
}

.header{
  background:linear-gradient(135deg,#C65B36,#A84826);
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}


.header .logo{
  height:56px;
  width:auto;
  display:block;
}



  

.banner{
  background:#EDE4D8;
  padding:12px 20px;
  font-weight:bold;
  color:var(--primary-dark);
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:1.2px;
  border-bottom:1px solid var(--border);
}

.container{
  max-width:520px;
  margin:24px auto;
  padding:0 16px 40px;
}

.card{
  background:var(--card);
  border-radius:18px;
  border:1px solid var(--border);
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,.05);
}

.card-title{
  background:var(--primary);
  color:white;
  padding:14px 18px;
  font-weight:bold;
  font-size:14px;
  text-transform:uppercase;
  letter-spacing:1px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.card-body{
  padding:18px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 0;
  border-bottom:1px dashed var(--border);
  font-size:14px;
}

.row:last-child{
  border-bottom:none;
}

.row span:first-child{
  color:var(--primary-dark);
  font-weight:600;
}

.row span:last-child{
  color:var(--text);
  font-weight:bold;
}

.divider{
  height:1px;
  background:var(--border);
  margin:8px 0 14px;
}

.potes-titulo{
  font-size:12px;
  font-weight:bold;
  color:var(--primary-dark);
  text-transform:uppercase;
  letter-spacing:1px;
  margin:18px 0 8px;
}

.pote{
  display:flex;
  align-items:center;
  gap:12px;
  background:#EFE7DD;
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
  transition:.2s;
}

.pote:hover{
  transform:translateY(-1px);
}

.pote:last-child{
  margin-bottom:0;
}

.pote-num{
  background:var(--primary);
  color:white;
  width:32px;
  height:32px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:bold;
  flex-shrink:0;
}

.pote-info{
  flex:1;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.pote-nome{
  font-size:14px;
  font-weight:bold;
  color:var(--text);
}

.pote-linha{
  font-size:12px;
  color:var(--primary-dark);
  font-weight:600;
}

.pote-linha::before{
  content:"🏭 ";
}

.sem-potes{
  text-align:center;
  padding:20px;
  color:var(--text-light);
}

.loading{
  text-align:center;
  padding:40px;
  color:var(--primary-dark);
  font-weight:bold;
}

.aguardando{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:40px 20px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,.05);
}

.aguardando .emoji{
  font-size:52px;
  margin-bottom:16px;
}

.aguardando h2{
  color:var(--primary-dark);
  margin:0 0 10px;
}

.aguardando p{
  color:var(--text-light);
  margin:0;
}

.erro{
  background:#FFF7F5;
  border:1px solid #E5B9A6;
  border-radius:16px;
  padding:20px;
  text-align:center;
  color:var(--primary-dark);
}

.footer{
  text-align:center;
  padding:18px;
  background:linear-gradient(135deg,#C65B36,#A84826);
  color:rgba(255,255,255,.8);
  font-size:12px;
}

.footer strong{
  color:#FFF;
}
</style>
  
</head>
<body>
<div class="header">
  <h1>🍪 Capricche</h1>
</div>
<div class="banner" id="banner-setor">Carregando...</div>
<div class="container">
  <div id="conteudo"><div class="loading">Buscando dados...</div></div>
</div>
<div class="footer">
  <p>Estações de Lanches · <strong>Capricche</strong></p>
  <p>Atualizado automaticamente a cada abastecimento</p>
</div>
<script>
  const RAW_URL="https://raw.githubusercontent.com/capriccheti-cpu/lanches-capricche/main/abastecimento.json";
  const SETOR=new URLSearchParams(window.location.search).get("setor")||"ADM";

  function dadosValidos(d){
    if(!d) return false;
    if(!d.abastecedor) return false;
    if(d.abastecedor.includes("<")) return false;
    return true;
  }

  function formatarData(str){
    if(!str) return "—";
    try{
      if(str.includes("T")){
        const d=new Date(str);
        return d.toLocaleDateString("pt-BR");
      }
      if(str.includes("-")){
        const [y,m,dia]=str.split("-");
        return `${dia}/${m}/${y}`;
      }
      return str;
    }catch(e){return str;}
  }

  // Verifica se um pote tem conteúdo válido (ignora vazio, "-" e "—")
  function poteTemConteudo(valor){
    if(!valor) return false;
    const v=String(valor).trim();
    return v!=="" && v!=="-" && v!=="—";
  }

  async function carregar(){
    try{
      const res=await fetch(RAW_URL+"?t="+Date.now());
      if(!res.ok) throw new Error("Erro "+res.status);
      const dados=await res.json();
      const d=dados[SETOR];

      document.getElementById("banner-setor").textContent="🍪 Estação · "+SETOR;

      if(!dadosValidos(d)){
        document.getElementById("conteudo").innerHTML=`
          <div class="aguardando">
            <div class="emoji">🕐</div>
            <h2>Olá!</h2>
            <p>Ainda estamos aguardando o abastecimento!</p>
          </div>`;
        return;
      }

      // potes e linhas podem vir como objeto {1:..,2:..} ou string "a|b|c|d|e"
      let potes=d.potes||{};
      let linhas=d.linhas||{};
      if(typeof potes==="string") potes=potes.split("|");
      if(typeof linhas==="string") linhas=linhas.split("|");

      // Monta a lista de potes preenchidos (1 a 5) e filtra os vazios
      const potesPreenchidos=[1,2,3,4,5]
        .map(n=>{
          const idx=n-1;
          const biscoito=(Array.isArray(potes)?potes[idx]:(potes[n]||potes[String(n)]))||"";
          const linha=(Array.isArray(linhas)?linhas[idx]:(linhas[n]||linhas[String(n)]))||"";
          return {n, biscoito, linha};
        })
        .filter(p=>poteTemConteudo(p.biscoito));

      const potesHTML=potesPreenchidos.length
        ? potesPreenchidos.map(p=>`
          <div class="pote">
            <div class="pote-num">${p.n}</div>
            <div class="pote-info">
              <span class="pote-nome">${p.biscoito}</span>
              ${p.linha?`<span class="pote-linha">${p.linha}</span>`:""}
            </div>
          </div>`).join("")
        : `<div class="sem-potes">Nenhum pote abastecido no momento.</div>`;

      document.getElementById("conteudo").innerHTML=`
        <div class="card">
          <div class="card-title">
            <span>📋 Abastecimento</span>
            <span>${d.horario||"—"}</span>
          </div>
          <div class="card-body">
            <div class="row"><span>Abastecedor</span><span>${d.abastecedor||"—"}</span></div>
            <div class="row"><span>Data</span><span>${formatarData(d.datahora||d.data)}</span></div>
            <div class="row"><span>Horário</span><span>${d.horario||"—"}</span></div>
            <div class="potes-titulo">🍪 Biscoitos nos Potes</div>
            <div class="divider"></div>
            ${potesHTML}
          </div>
        </div>`;

    }catch(e){
      document.getElementById("conteudo").innerHTML=`
        <div class="erro"><p>⚠️ Não foi possível carregar os dados.</p><p style="font-size:12px;margin-top:6px">${e.message}</p></div>`;
    }
  }

  carregar();
  setInterval(carregar, 30000);
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="visible") carregar();
  });
</script>
</body>
</html>
