<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Capricche — Estação de Lanches</title>

<style>
body{font-family:Arial,sans-serif;margin:0;background:#fff5f5;}
.header{background:#D41217;padding:16px 20px;display:flex;align-items:center;gap:12px;}
.header h1{color:white;font-size:20px;margin:0;}

.banner{background:#F5C518;padding:10px 20px;font-weight:bold;color:#A50D11;font-size:14px;text-transform:uppercase;}

.container{max-width:480px;margin:20px auto;padding:0 16px 40px;}

.card{background:white;border-radius:12px;border:1px solid rgba(212,18,23,0.15);overflow:hidden;margin-bottom:16px;box-shadow:0 2px 12px rgba(212,18,23,0.08);}
.card-title{background:#D41217;color:white;padding:10px 16px;font-weight:bold;font-size:13px;display:flex;justify-content:space-between;}
.card-body{padding:16px;}

.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed rgba(212,18,23,0.12);}
.row:last-child{border-bottom:none;}
.row span:first-child{color:#A50D11;font-weight:bold;}
.row span:last-child{color:#2A0203;font-weight:bold;}

.potes-titulo{font-size:12px;font-weight:bold;color:#A50D11;margin:12px 0 8px;}

.potes{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

.pote{display:flex;align-items:center;gap:8px;background:rgba(212,18,23,0.06);border-radius:8px;padding:8px 10px;}
.pote-num{background:#D41217;color:white;width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;}

.pote-nome{font-size:13px;font-weight:bold;color:#2A0203;}
.pote-linha{font-size:11px;color:#A50D11;opacity:0.8;}

.aguardando{background:white;border-radius:12px;border:1px solid rgba(212,18,23,0.15);padding:40px 20px;text-align:center;}
.loading{text-align:center;padding:40px;color:#A50D11;font-weight:bold;}
.erro{background:#fff0f0;border:1px solid #D41217;border-radius:10px;padding:20px;text-align:center;color:#A50D11;}

.footer{text-align:center;padding:16px;background:#A50D11;color:white;font-size:12px;}
</style>
</head>

<body>

<div class="header">
  <h1>🍪 Capricche</h1>
</div>

<div class="banner" id="banner-setor">Carregando...</div>

<div class="container">
  <div id="conteudo">
    <div class="loading">Buscando dados...</div>
  </div>
</div>

<div class="footer">
  <p>Estações de Lanches · <strong>Capricche</strong></p>
</div>

<script>
const RAW_URL = "https://raw.githubusercontent.com/capriccheti-cpu/lanches-capricche/main/abastecimento.json";
const SETOR = new URLSearchParams(window.location.search).get("setor") || "ADM";

function formatarData(str){
  if(!str) return "—";
  try{
    const [y,m,d]=str.split("-");
    return d+"/"+m+"/"+y;
  }catch{
    return str;
  }
}

async function carregar(){
  try{
    const res = await fetch(RAW_URL + "?t=" + Date.now());
    const dados = await res.json();
    const d = dados[SETOR];

    document.getElementById("banner-setor").innerText = "🍪 Estação · " + SETOR;

    if(!d || !d.abastecedor){
      document.getElementById("conteudo").innerHTML = `
        <div class="aguardando">
          <div style="font-size:40px">🕐</div>
          <h2>Aguardando abastecimento</h2>
        </div>`;
      return;
    }

    const potes = d.potes || {};

    // ✅ AQUI ESTÁ A CORREÇÃO
    const potesHTML = [1,2,3,4,5].map(n => {
      const p = potes[n] || potes[String(n)];

      return `
      <div class="pote">
        <div class="pote-num">${n}</div>
        <div>
          <div class="pote-nome">${p ? p.produto : "—"}</div>
          <div class="pote-linha">${p ? p.linha : ""}</div>
        </div>
      </div>
      `;
    }).join("");

    document.getElementById("conteudo").innerHTML = `
      <div class="card">
        <div class="card-title">
          <span>📋 Abastecimento</span>
          <span>${d.horario || "—"}</span>
        </div>

        <div class="card-body">
          <div class="row"><span>Abastecedor</span><span>${d.abastecedor}</span></div>
          <div class="row"><span>Data</span><span>${formatarData(d.datahora)}</span></div>
          <div class="row"><span>Horário</span><span>${d.horario || "—"}</span></div>

          <div class="potes-titulo">🍪 Biscoitos nos Potes</div>

          <div class="potes">${potesHTML}</div>
        </div>
      </div>
    `;

  }catch(e){
    document.getElementById("conteudo").innerHTML = `
      <div class="erro">
        <p>Erro ao carregar</p>
      </div>`;
  }
}

carregar();
setInterval(carregar, 30000);
</script>

</body>
</html>
