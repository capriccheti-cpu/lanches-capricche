name: Atualizar Abastecimento

on:
  repository_dispatch:
    types: [atualizar-abastecimento]

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Atualizar JSON
        run: |
          SETOR="${{ github.event.client_payload.setor }}"
          ABASTECEDOR="${{ github.event.client_payload.abastecedor }}"
          DATAHORA="${{ github.event.client_payload.datahora }}"
          POTE1="${{ github.event.client_payload.pote1 }}"
          POTE2="${{ github.event.client_payload.pote2 }}"
          POTE3="${{ github.event.client_payload.pote3 }}"
          POTE4="${{ github.event.client_payload.pote4 }}"
          POTE5="${{ github.event.client_payload.pote5 }}"

          cat abastecimento.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          data['$SETOR'] = {
            'setor': '$SETOR',
            'abastecedor': '$ABASTECEDOR',
            'datahora': '$DATAHORA',
            'potes': {'1':'$POTE1','2':'$POTE2','3':'$POTE3','4':'$POTE4','5':'$POTE5'}
          }
          print(json.dumps(data, ensure_ascii=False, indent=2))
          " > abastecimento_novo.json
          mv abastecimento_novo.json abastecimento.json

      - name: Commit e Push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add abastecimento.json
          git commit -m "Abastecimento ${{ github.event.client_payload.setor }} ${{ github.event.client_payload.datahora }}"
          git push
