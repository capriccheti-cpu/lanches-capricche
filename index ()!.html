<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Capricche — Estação de Lanches</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
  :root {
    --red: #D41217; --red-dark: #A50D11; --gold: #F5C518;
    --gold-dark: #C9A200; --white: #FFFFFF; --cream: #FFF5F5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: var(--cream); min-height: 100vh; display: flex; flex-direction: column; }

  .header {
    background: linear-gradient(135deg, #A50D11 0%, #D41217 60%, #F5393D 100%);
    padding: 0; position: relative; overflow: hidden;
  }
  .header-glow {
    position: absolute; top: -40px; left: 50%; transform: translateX(-50%);
    width: 200px; height: 120px;
    background: radial-gradient(ellipse, rgba(245,197,24,0.35) 0%, transparent 70%);
    pointer-events: none;
  }
  .header-inner {
    position: relative; z-index: 1; padding: 20px 20px 16px;
    display: flex; align-items: center; gap: 14px;
  }
  .logo-heart { width: 52px; height: 52px; flex-shrink: 0; }
  .logo-text { font-size: 26px; font-weight: 900; color: #fff; letter-spacing: -0.5px; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
  .logo-text span { color: var(--gold); }
  .header-setor-badge {
    margin-left: auto; background: rgba(255,255,255,0.18);
    border: 1.5px solid rgba(255,255,255,0.35); border-radius: 20px;
    padding: 6px 14px; color: #fff; font-size: 13px; font-weight: 800;
    letter-spacing: 0.5px; white-space: nowrap;
  }

  .setor-banner {
    background: var(--gold); padding: 10px 20px;
    display: flex; align-items: center; gap: 10px;
  }
  .setor-banner-icon { font-size: 20px; }
  .setor-banner-text { font-size: 13px; font-weight: 800; color: var(--red-dark); text-transform: uppercase; letter-spacing: 1px; }
  .setor-banner-sub { font-size: 11px; color: var(--red-dark); opacity: 0.75; margin-left: auto; }

  .main { flex: 1; padding: 20px 16px 32px; max-width: 480px; margin: 0 auto; width: 100%; }

  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(212,18,23,0.08); border: 1px solid rgba(212,18,23,0.2);
    border-radius: 20px; padding: 5px 12px;
    font-size: 11px; font-weight: 800; color: var(--red-dark); margin-bottom: 14px;
  }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%; background: #22c55e;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(1.3)} }

  .qr-fixo-notice {
    background: rgba(245,197,24,0.12); border: 1px solid var(--gold);
    border-radius: 12px; padding: 10px 14px; margin-bottom: 16px;
    display: flex; align-items: flex-start; gap: 8px;
  }
  .qr-fixo-notice span { font-size: 11px; color: var(--gold-dark); font-weight: 700; line-height: 1.5; }

  .card {
    background: #fff; border-radius: 20px;
    border: 1.5px solid rgba(212,18,23,0.12);
    overflow: hidden; margin-bottom: 16px;
    box-shadow: 0 4px 20px rgba(212,18,23,0.08);
  }
  .card-header {
    background: var(--red); padding: 12px 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .card-header-icon { font-size: 16px; }
  .card-header-title { font-size: 12px; font-weight: 800; color: #fff; letter-spacing: 1px; text-transform: uppercase; }
  .card-header-time {
    margin-left: auto; background: rgba(255,255,255,0.2);
    border-radius: 12px; padding: 3px 10px; font-size: 12px; font-weight: 700; color: #fff;
  }
  .card-body { padding: 16px; }

  .info-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; border-bottom: 1px dashed rgba(212,18,23,0.1);
  }
  .info-row:last-child { border-bottom: none; }
  .info-icon { font-size: 16px; width: 22px; text-align: center; flex-shrink: 0; }
  .info-label { font-size: 12px; color: #A50D11; font-weight: 700; width: 90px; flex-shrink: 0; }
  .info-value { font-size: 13px; color: #2A0203; font-weight: 700; }

  .potes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
  .pote-chip {
    background: rgba(212,18,23,0.06); border: 1px solid rgba(212,18,23,0.15);
    border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 8px;
  }
  .pote-num {
    width: 26px; height: 26px; border-radius: 8px;
    background: var(--red); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 900; flex-shrink: 0;
  }
  .pote-biscuit { font-size: 12px; font-weight: 700; color: #2A0203; line-height: 1.3; }

  .loading { text-align: center; padding: 48px 20px; }
  .loading-spinner {
    width: 44px; height: 44px; border-radius: 50%;
    border: 4px solid rgba(212,18,23,0.15); border-top-color: var(--red);
    animation: spin 0.8s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading p { color: var(--red-dark); font-weight: 700; font-size: 14px; }

  .error-box {
    background: #FFF0F0; border: 1.5px solid var(--red);
    border-radius: 16px; padding: 24px; text-align: center;
  }
  .error-box p { color: var(--red-dark); font-weight: 700; }
  .error-box small { color: #A50D11; font-size: 12px; display: block; margin-top: 6px; }

  .footer {
    background: var(--red-dark); padding: 14px 20px; text-align: center;
  }
  .footer p { color: rgba(255,255,255,0.6); font-size: 11px; }
  .footer strong { color: var(--gold); }
</style>
</head>
<body>

<div class="header">
  <div class="header-glow"></div>
  <div class="header-inner">
    <svg class="logo-heart" viewBox="0 0 52 52" fill="none">
      <path d="M26 46s-20-12.5-20-26C6 13.1 11.5 8 18 8c3.5 0 6.6 1.6 8 4 1.4-2.4 4.5-4 8-4 6.5 0 12 5.1 12 12C46 33.5 26 46 26 46z" fill="white" fill-opacity="0.25"/>
      <path d="M26 44s-18-11.5-18-24C8 13.7 13 9 19 9c3.3 0 6.2 1.5 7 3.5C26.8 10.5 29.7 9 33 9c6 0 11 4.7 11 11C44 32.5 26 44 26 44z" fill="white" fill-opacity="0.4"/>
      <circle cx="26" cy="14" r="5" fill="#F5C518"/>
      <line x1="26" y1="6" x2="26" y2="4" stroke="#F5C518" stroke-width="2" stroke-linecap="round"/>
      <line x1="33" y1="8" x2="34.5" y2="6.5" stroke="#F5C518" stroke-width="2" stroke-linecap="round"/>
      <line x1="36" y1="14" x2="38" y2="14" stroke="#F5C518" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <div class="logo-text">Capric<span>che</span></div>
    <div class="header-setor-badge" id="header-setor">...</div>
  </div>
</div>

<div class="setor-banner">
  <span class="setor-banner-icon">🍪</span>
  <span class="setor-banner-text" id="banner-setor-nome">Carregando...</span>
  <span class="setor-banner-sub" id="banner-data">—</span>
</div>

<div class="main">
  <div class="status-pill">
    <div class="status-dot"></div>
    Informações em tempo real
  </div>
  <div class="qr-fixo-notice">
    <span>📌</span>
    <span>Este QR Code é <strong>fixo e permanente</strong> para este setor. As informações abaixo são sempre atualizadas a cada novo abastecimento.</span>
  </div>
  <div id="conteudo">
    <div class="loading">
      <div class="loading-spinner"></div>
      <p>Buscando abastecimento...</p>
    </div>
  </div>
</div>

<div class="footer">
  <p>Estações de Lanches · <strong>Capricche</strong></p>
  <p style="margin-top:3px">Dados atualizados automaticamente via SharePoint</p>
</div>

<script>
  // ================================================================
  // CONFIGURAÇÃO — URL do SharePoint
  // ================================================================
  const SHAREPOINT_SITE = "https://capriccheadm.sharepoint.com/sites/AppsEmDesenvolvimento";
  const LISTA = "UltimoAbastecimento";
  // ================================================================

  function getSetor() {
    const params = new URLSearchParams(window.location.search);
    return params.get("setor") || "ADM";
  }

  const SETOR = getSetor();

  function formatData(dateStr) {
    if (!dateStr) return "—";
    const d = new Date(dateStr);
    return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" });
  }

  function formatHora(dateStr) {
    if (!dateStr) return "—";
    const d = new Date(dateStr);
    return d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  }

  function renderDados(item) {
    document.getElementById("header-setor").textContent = item.Setor || SETOR;
    document.getElementById("banner-setor-nome").textContent = "Estação · " + (item.Setor || SETOR);
    document.getElementById("banner-data").textContent = formatData(item.DataHora);

    const potes = [
      item.Pote_1 || "—",
      item.Pote_2 || "—",
      item.Pote_3 || "—",
      item.Pote_4 || "—",
      item.Pote_5 || "—"
    ];

    const potesHTML = potes.map((b, i) => `
      <div class="pote-chip">
        <div class="pote-num">${i + 1}</div>
        <div class="pote-biscuit">${b}</div>
      </div>`).join("");

    document.getElementById("conteudo").innerHTML = `
      <div class="card">
        <div class="card-header">
          <span class="card-header-icon">🕐</span>
          <span class="card-header-title">Último abastecimento</span>
          <span class="card-header-time">${formatHora(item.DataHora)}</span>
        </div>
        <div class="card-body">
          <div class="info-row">
            <span class="info-icon">👤</span>
            <span class="info-label">Abastecedor</span>
            <span class="info-value">${item.Abastecedor || "—"}</span>
          </div>
          <div class="info-row">
            <span class="info-icon">📅</span>
            <span class="info-label">Data</span>
            <span class="info-value">${formatData(item.DataHora)}</span>
          </div>
          <div class="info-row">
            <span class="info-icon">🕐</span>
            <span class="info-label">Horário</span>
            <span class="info-value">${formatHora(item.DataHora)}</span>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-header">
          <span class="card-header-icon">🍪</span>
          <span class="card-header-title">Biscoitos nos potes</span>
        </div>
        <div class="card-body">
          <div class="potes-grid">${potesHTML}</div>
        </div>
      </div>`;
  }

  async function carregarDados() {
    try {
      // API REST do SharePoint — acesso público anônimo
      const url = `${SHAREPOINT_SITE}/_api/web/lists/getbytitle('${LISTA}')/items?$filter=Title eq '${SETOR}'&$select=Title,Setor,Abastecedor,DataHora,Pote_1,Pote_2,Pote_3,Pote_4,Pote_5&$top=1`;

      const res = await fetch(url, {
        headers: { "Accept": "application/json;odata=verbose" }
      });

      if (!res.ok) throw new Error("HTTP " + res.status);

      const data = await res.json();
      const items = data.d.results;

      if (!items || items.length === 0) {
        document.getElementById("conteudo").innerHTML = `
          <div class="error-box">
            <p>⚠️ Nenhum abastecimento encontrado</p>
            <small>Setor: ${SETOR}</small>
          </div>`;
        return;
      }

      renderDados(items[0]);

    } catch (e) {
      document.getElementById("conteudo").innerHTML = `
        <div class="error-box">
          <p>⚠️ Não foi possível carregar os dados</p>
          <small>${e.message}</small>
          <small style="margin-top:8px">Verifique se o SharePoint permite acesso anônimo à lista.</small>
        </div>`;
    }
  }

  carregarDados();
  // Atualiza a cada 60 segundos
  setInterval(carregarDados, 60000);
</script>
</body>
</html>
